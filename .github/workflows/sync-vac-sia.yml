name: Synchroniser VAC SIA

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer une synchronisation complète même si le cycle SIA est inchangé"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-vac-sia
  cancel-in-progress: false

jobs:
  sync-vac:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Synchroniser les VAC
        shell: bash
        run: |
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python tools/sync_vac_sia.py --repo-root . --workers 4 $FORCE_ARG

      - name: Ajouter le résumé au workflow
        if: always()
        shell: bash
        run: |
          if [ -f sync-report/summary.md ]; then
            cat sync-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun résumé généré." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver le rapport technique
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-sync-vac-sia
          path: sync-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Publier les modifications dans le dépôt
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json vac/

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi

          CYCLE="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("manifest.json")
          if p.exists():
              try:
                  print(json.loads(p.read_text(encoding="utf-8")).get("sourceCycle", "inconnu"))
              except Exception:
                  print("inconnu")
          else:
              print("inconnu")
          PY
          )"

          git commit -m "VAC SIA ${CYCLE}"
          git push
